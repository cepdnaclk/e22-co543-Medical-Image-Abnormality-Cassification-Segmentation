<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGradCam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1100" height="520" fill="url(#bgGradCam)" />

  <!-- Header -->
  <g transform="translate(50, 35)">
    <text x="0" y="24" fill="#fb7185" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">QUALITATIVE INTERPRETABILITY &amp; SPATIAL LOCALIZATION</text>
    <text x="0" y="52" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="800">Grad-CAM Visual Saliency &amp; Diagnostic Explainability</text>
    <text x="0" y="74" fill="#94a3b8" font-family="sans-serif" font-size="13">Deriving pixel-level lesion activation heatmaps without manual ground-truth segmentation masks</text>
  </g>

  <!-- Flowchart Section -->
  <g transform="translate(50, 115)" filter="url(#shadow)">
    <rect width="1000" height="365" rx="14" fill="url(#cardGradCam)" stroke="#334155" stroke-width="1.2" />

    <!-- STEP 1: Input MRI -->
    <g transform="translate(30, 30)">
      <rect width="170" height="200" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="16" y="28" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">1. Input MRI Scan</text>
      
      <rect x="25" y="45" width="120" height="90" rx="8" fill="#020617" stroke="#1e293b"/>
      <ellipse cx="85" cy="90" rx="40" ry="32" fill="#334155" />
      <circle cx="95" cy="85" r="14" fill="#64748b" />
      
      <text x="85" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Preprocessed 224×224</text>
      <text x="85" y="176" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Standardized ImageNet</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 215 130 L 245 130" stroke="#38bdf8" stroke-width="2" />

    <!-- STEP 2: Backbone & Feature Hooks -->
    <g transform="translate(260, 30)">
      <rect width="210" height="200" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="16" y="28" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">2. Feature Layer Hook</text>

      <rect x="20" y="45" width="170" height="90" rx="8" fill="#020617" stroke="#1e293b"/>
      <text x="105" y="75" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Target Conv Layer</text>
      <text x="105" y="95" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">ResNet-18: 'layer4'</text>
      <text x="105" y="112" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">EfficientNet: 'conv_head'</text>

      <text x="105" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Extract Activation Maps</text>
      <text x="105" y="176" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">A^k ∈ R^{7×7×C}</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 485 130 L 515 130" stroke="#c084fc" stroke-width="2" />

    <!-- STEP 3: Gradient Computation -->
    <g transform="translate(530, 30)">
      <rect width="210" height="200" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="16" y="28" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">3. Gradient Backprop</text>

      <rect x="20" y="45" width="170" height="90" rx="8" fill="#020617" stroke="#1e293b"/>
      <text x="105" y="72" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Neuron Weights α_k^c</text>
      <text x="105" y="92" fill="#f8fafc" font-family="sans-serif" font-size="10" text-anchor="middle">α_k^c = (1/Z) ∑∑ ∂y^c / ∂A^k</text>
      <text x="105" y="114" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Global Avg Pooling (GAP)</text>

      <text x="105" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Score Gradient vs. Features</text>
      <text x="105" y="176" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Linear Combination + ReLU</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 755 130 L 785 130" stroke="#fbbf24" stroke-width="2" />

    <!-- STEP 4: Heatmap Overlay -->
    <g transform="translate(800, 30)">
      <rect width="170" height="200" rx="10" fill="#0f172a" stroke="#fb7185" stroke-width="1.2"/>
      <text x="16" y="28" fill="#fb7185" font-family="sans-serif" font-size="12" font-weight="700">4. Heatmap Overlay</text>

      <!-- Simulated Jet Colormap Overlay -->
      <rect x="25" y="45" width="120" height="90" rx="8" fill="#020617" stroke="#1e293b"/>
      <ellipse cx="85" cy="90" rx="40" ry="32" fill="#334155" />
      <circle cx="95" cy="85" r="14" fill="#ef4444" fill-opacity="0.85" />
      <circle cx="95" cy="85" r="22" fill="#f59e0b" fill-opacity="0.5" />

      <text x="85" y="160" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">COLORMAP_JET</text>
      <text x="85" y="176" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Alpha Blend α = 0.4</text>
    </g>

    <!-- Class-Specific Saliency Verification Row -->
    <g transform="translate(30, 250)">
      <rect width="940" height="95" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="20" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">PATHOLOGICAL INTERPRETATION VALIDATION ACROSS CLASSES:</text>

      <g transform="translate(20, 38)">
        <text x="0" y="16" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="700">Glioma:</text>
        <text x="0" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">Deep subcortical white-matter</text>
        <text x="0" y="48" fill="#64748b" font-family="sans-serif" font-size="10">infiltrative tissue activation</text>

        <text x="240" y="16" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="700">Meningioma:</text>
        <text x="240" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">Periphery extra-axial focus on</text>
        <text x="240" y="48" fill="#64748b" font-family="sans-serif" font-size="10">dural tissue membrane</text>

        <text x="480" y="16" fill="#ddd6fe" font-family="sans-serif" font-size="11" font-weight="700">Pituitary:</text>
        <text x="480" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">Focal activation locked to</text>
        <text x="480" y="48" fill="#64748b" font-family="sans-serif" font-size="10">sella turcica / skull base</text>

        <text x="710" y="16" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="700">No Tumor:</text>
        <text x="710" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">Homogeneous low background,</text>
        <text x="710" y="48" fill="#64748b" font-family="sans-serif" font-size="10">zero focal hot-spots</text>
      </g>
    </g>
  </g>
</svg>
