<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="680" fill="url(#grid)" />
  </g>

  <!-- Title Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">END-TO-END PIPELINE</text>
    
    <text x="0" y="58" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">Brain Tumor MRI Classification &amp; Explainability Architecture</text>
    <text x="0" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">From Raw Multi-Class Scans to Preprocessing, Dual-Backbone Deep Learning, and Grad-CAM Localization</text>
  </g>

  <!-- Flow Connector Lines -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M 230 360 L 270 360" stroke="#38bdf8" stroke-dasharray="4 4" />
    <path d="M 470 360 L 510 360" stroke="#34d399" stroke-dasharray="4 4" />
    <path d="M 710 360 L 750 360" stroke="#c084fc" stroke-dasharray="4 4" />
    <path d="M 950 360 L 990 360" stroke="#fbbf24" stroke-dasharray="4 4" />
  </g>

  <!-- STEP 1: Dataset & Ingestion -->
  <g transform="translate(50, 180)" filter="url(#shadow)">
    <rect width="200" height="420" rx="16" fill="url(#cardGrad1)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="5" rx="2" fill="url(#blueAccent)" />
    
    <circle cx="35" cy="40" r="18" fill="#38bdf8" fill-opacity="0.15" />
    <text x="35" y="45" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="65" y="44" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Data Ingestion</text>

    <!-- Content Items -->
    <g transform="translate(18, 80)">
      <rect width="164" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">MRI Dataset</text>
      <text x="12" y="44" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">7,022 Total Scans</text>
    </g>

    <g transform="translate(18, 155)">
      <text x="0" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">4 Pathological Classes:</text>
      <rect x="0" y="28" width="76" height="24" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.8"/>
      <text x="38" y="44" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Glioma</text>

      <rect x="86" y="28" width="78" height="24" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="125" y="44" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Meningioma</text>

      <rect x="0" y="60" width="76" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="0.8"/>
      <text x="38" y="76" fill="#ddd6fe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pituitary</text>

      <rect x="86" y="60" width="78" height="24" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
      <text x="125" y="76" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">No Tumor</text>
    </g>

    <g transform="translate(18, 265)">
      <rect width="164" height="125" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">STRATIFIED PARTITION</text>
      
      <text x="12" y="50" fill="#e2e8f0" font-family="sans-serif" font-size="12">Train Set:</text>
      <text x="152" y="50" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">4,480 (80%)</text>
      
      <text x="12" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="12">Val Set:</text>
      <text x="152" y="75" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">1,120 (20%)</text>

      <text x="12" y="100" fill="#e2e8f0" font-family="sans-serif" font-size="12">Official Test:</text>
      <text x="152" y="100" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">1,600 (Balanced)</text>
    </g>
  </g>

  <!-- STEP 2: Preprocessing Engine -->
  <g transform="translate(280, 180)" filter="url(#shadow)">
    <rect width="210" height="420" rx="16" fill="url(#cardGrad1)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="5" rx="2" fill="url(#greenAccent)" />

    <circle cx="35" cy="40" r="18" fill="#34d399" fill-opacity="0.15" />
    <text x="35" y="45" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="65" y="44" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Medical Preprocessing</text>

    <!-- 4 Sub-blocks -->
    <g transform="translate(18, 75)">
      <rect width="174" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">1. Skull Stripping</text>
      <text x="12" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10">Otsu threshold + Morph</text>
      <text x="12" y="54" fill="#64748b" font-family="sans-serif" font-size="10">Crops bounding contour</text>
    </g>

    <g transform="translate(18, 150)">
      <rect width="174" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">2. Bilateral Filter</text>
      <text x="12" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10">Edge-preserving denoising</text>
      <text x="12" y="54" fill="#64748b" font-family="sans-serif" font-size="10">d=9, σColor=75, σSpace=75</text>
    </g>

    <g transform="translate(18, 225)">
      <rect width="174" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">3. CLAHE (LAB Space)</text>
      <text x="12" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10">L-channel local contrast</text>
      <text x="12" y="54" fill="#64748b" font-family="sans-serif" font-size="10">clipLimit=2.0, tileGrid=(8,8)</text>
    </g>

    <g transform="translate(18, 300)">
      <rect width="174" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">4. Albumentations</text>
      <text x="12" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10">Affine, Flips, ColorJitter</text>
      <text x="12" y="54" fill="#64748b" font-family="sans-serif" font-size="10">Standardize to 224×224</text>
    </g>
  </g>

  <!-- STEP 3: Model Architecture -->
  <g transform="translate(520, 180)" filter="url(#shadow)">
    <rect width="210" height="420" rx="16" fill="url(#cardGrad1)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="5" rx="2" fill="url(#purpleAccent)" />

    <circle cx="35" cy="40" r="18" fill="#c084fc" fill-opacity="0.15" />
    <text x="35" y="45" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="65" y="44" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Dual Deep Models</text>

    <!-- ResNet-18 Card -->
    <g transform="translate(18, 75)">
      <rect width="174" height="135" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">ResNet-18 (Baseline)</text>
      <text x="12" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">Residual skip connections</text>
      
      <line x1="12" y1="56" x2="162" y2="56" stroke="#1e293b" />
      <text x="12" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">Params:</text>
      <text x="162" y="74" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">11.18 M</text>
      <text x="12" y="94" fill="#cbd5e1" font-family="sans-serif" font-size="11">Complexity:</text>
      <text x="162" y="94" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">1.81 GFLOPs</text>
      <text x="12" y="114" fill="#cbd5e1" font-family="sans-serif" font-size="11">Latency:</text>
      <text x="162" y="114" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">5.04 ms/img</text>
    </g>

    <!-- EfficientNet-B0 Card -->
    <g transform="translate(18, 225)">
      <rect width="174" height="155" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="12" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">EfficientNet-B0</text>
      <text x="12" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">Compound scaling &amp; SE-blocks</text>
      
      <line x1="12" y1="56" x2="162" y2="56" stroke="#1e293b" />
      <text x="12" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">Params:</text>
      <text x="162" y="74" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="end">4.01 M (-64%)</text>
      <text x="12" y="94" fill="#cbd5e1" font-family="sans-serif" font-size="11">Complexity:</text>
      <text x="162" y="94" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="end">0.39 G (-78%)</text>
      <text x="12" y="114" fill="#cbd5e1" font-family="sans-serif" font-size="11">Latency:</text>
      <text x="162" y="114" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">5.40 ms/img</text>
      
      <rect x="12" y="125" width="150" height="20" rx="4" fill="#34d399" fill-opacity="0.15" />
      <text x="87" y="139" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">EDGE-DEPLOYMENT READY</text>
    </g>
  </g>

  <!-- STEP 4: Evaluation & Performance -->
  <g transform="translate(755, 180)" filter="url(#shadow)">
    <rect width="205" height="420" rx="16" fill="url(#cardGrad1)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="205" height="5" rx="2" fill="url(#amberAccent)" />

    <circle cx="35" cy="40" r="18" fill="#fbbf24" fill-opacity="0.15" />
    <text x="35" y="45" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="65" y="44" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Test Benchmarking</text>

    <!-- Test Set Accuracy Card -->
    <g transform="translate(16, 75)">
      <rect width="173" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">TEST ACCURACY</text>
      
      <text x="12" y="54" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="800">95.69%</text>
      <text x="12" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="10">ResNet-18 (Macro F1: 0.956)</text>
      
      <text x="12" y="90" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700">95.62% <tspan fill="#64748b" font-weight="400">EfficientNet-B0</tspan></text>
    </g>

    <!-- 3-Stage Ablation Mini Card -->
    <g transform="translate(16, 190)">
      <rect width="173" height="190" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">3-STAGE ABLATION</text>
      
      <text x="12" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">Stage 1: Pure Raw</text>
      <rect x="12" y="56" width="149" height="10" rx="5" fill="#1e293b" />
      <rect x="12" y="56" width="109" height="10" rx="5" fill="#ef4444" />
      <text x="12" y="78" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="700">73.19% Baseline</text>

      <text x="12" y="100" fill="#94a3b8" font-family="sans-serif" font-size="10">Stage 2: Raw + Aug</text>
      <rect x="12" y="106" width="149" height="10" rx="5" fill="#1e293b" />
      <rect x="12" y="106" width="139" height="10" rx="5" fill="#f59e0b" />
      <text x="12" y="128" fill="#fde68a" font-family="sans-serif" font-size="10" font-weight="700">93.31% (+20.12%)</text>

      <text x="12" y="150" fill="#94a3b8" font-family="sans-serif" font-size="10">Stage 3: Full Medical</text>
      <rect x="12" y="156" width="149" height="10" rx="5" fill="#1e293b" />
      <rect x="12" y="156" width="143" height="10" rx="5" fill="#10b981" />
      <text x="12" y="178" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">95.69% (+22.50%)</text>
    </g>
  </g>

  <!-- STEP 5: Visual Explainability -->
  <g transform="translate(985, 180)" filter="url(#shadow)">
    <rect width="175" height="420" rx="16" fill="url(#cardGrad1)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="175" height="5" rx="2" fill="url(#roseAccent)" />

    <circle cx="30" cy="40" r="18" fill="#fb7185" fill-opacity="0.15" />
    <text x="30" y="45" fill="#fb7185" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">5</text>
    <text x="58" y="44" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Explainability</text>

    <!-- Grad-CAM Card -->
    <g transform="translate(14, 75)">
      <rect width="147" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" fill="#fb7185" font-family="sans-serif" font-size="11" font-weight="700">Grad-CAM Maps</text>
      <text x="12" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">Layer: Conv Head</text>
      <text x="12" y="56" fill="#94a3b8" font-family="sans-serif" font-size="10">Target Score Gradient</text>
      <text x="12" y="70" fill="#94a3b8" font-family="sans-serif" font-size="10">GAP Feature Weights</text>
      <text x="12" y="90" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">Jet Heatmap Overlay</text>
      <text x="12" y="106" fill="#64748b" font-family="sans-serif" font-size="9">α=0.4 Blended</text>
    </g>

    <!-- Clinical Verification -->
    <g transform="translate(14, 210)">
      <rect width="147" height="170" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">CLINICAL VALUE</text>
      
      <circle cx="20" cy="48" r="4" fill="#10b981" />
      <text x="32" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="10">Tumor Localization</text>

      <circle cx="20" cy="74" r="4" fill="#10b981" />
      <text x="32" y="78" fill="#cbd5e1" font-family="sans-serif" font-size="10">Zero-Mask Overhead</text>

      <circle cx="20" cy="100" r="4" fill="#10b981" />
      <text x="32" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="10">Radiologist Trust</text>

      <circle cx="20" cy="126" r="4" fill="#10b981" />
      <text x="32" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="10">Automated Report</text>
      
      <rect x="12" y="142" width="123" height="18" rx="4" fill="#38bdf8" fill-opacity="0.15" />
      <text x="73" y="155" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">ADR GENERATION</text>
    </g>
  </g>

  <!-- Hardware Badge Footer -->
  <g transform="translate(60, 620)">
    <rect x="0" y="0" width="1080" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12">Target Environment: <tspan fill="#38bdf8" font-weight="600">NVIDIA RTX 6000 Ada Generation GPU (50.87 GB VRAM)</tspan> | PyTorch 2.13.0+cu130 | Mixed-Precision AMP</text>
    <text x="1060" y="25" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">University of Peradeniya • CO5430 Computer Vision</text>
  </g>
</svg>
