<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1100" height="480" fill="url(#bg)" />

  <!-- Title -->
  <g transform="translate(50, 35)">
    <text x="0" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">IMAGE PROCESSING FOUNDATION</text>
    <text x="0" y="52" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="800">4-Stage Medical Image Preprocessing Pipeline</text>
    <text x="0" y="74" fill="#94a3b8" font-family="sans-serif" font-size="13">Mitigating MRI acquisition noise, background padding, and poor soft-tissue contrast before deep neural feature extraction</text>
  </g>

  <!-- Connectors -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.6">
    <path d="M 270 270 L 310 270" />
    <path d="M 520 270 L 560 270" />
    <path d="M 770 270 L 810 270" />
  </g>

  <!-- STAGE 1: Raw & Skull Stripping -->
  <g transform="translate(50, 140)" filter="url(#shadow)">
    <rect width="220" height="300" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1.2" />
    <rect width="220" height="4" rx="2" fill="url(#cyan)" />
    
    <rect x="20" y="25" width="28" height="28" rx="6" fill="#38bdf8" fill-opacity="0.15" />
    <text x="34" y="44" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">1</text>
    <text x="58" y="44" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Contour Cropping</text>

    <!-- Brain Icon Simulation -->
    <g transform="translate(45, 75)">
      <rect width="130" height="100" rx="8" fill="#020617" stroke="#1e293b" />
      <rect x="25" y="15" width="80" height="70" rx="35" fill="#334155" />
      <circle cx="55" cy="45" r="12" fill="#475569" />
      <circle cx="75" cy="50" r="14" fill="#475569" />
      <rect x="23" y="13" width="84" height="74" rx="4" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="65" y="94" fill="#ef4444" font-family="sans-serif" font-size="8" text-anchor="middle">Bounding Box Crop</text>
    </g>

    <g transform="translate(20, 195)">
      <text x="0" y="15" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">• Otsu Thresholding</text>
      <text x="0" y="32" fill="#94a3b8" font-family="sans-serif" font-size="10">  Segments brain tissue area</text>
      <text x="0" y="52" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">• Morphological Filtering</text>
      <text x="0" y="69" fill="#94a3b8" font-family="sans-serif" font-size="10">  Erode &amp; Dilate (2 iterations)</text>
      <text x="0" y="89" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">✓ Strips 40-60% black border</text>
    </g>
  </g>

  <!-- STAGE 2: Bilateral Filtering -->
  <g transform="translate(300, 140)" filter="url(#shadow)">
    <rect width="220" height="300" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1.2" />
    <rect width="220" height="4" rx="2" fill="url(#emerald)" />

    <rect x="20" y="25" width="28" height="28" rx="6" fill="#34d399" fill-opacity="0.15" />
    <text x="34" y="44" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">2</text>
    <text x="58" y="44" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Bilateral Filter</text>

    <!-- Filter Simulation -->
    <g transform="translate(45, 75)">
      <rect width="130" height="100" rx="8" fill="#020617" stroke="#1e293b" />
      <rect x="20" y="15" width="90" height="70" rx="35" fill="#10b981" fill-opacity="0.3" />
      <!-- Sharp Edge -->
      <path d="M 45 25 Q 70 40 60 75" stroke="#34d399" stroke-width="3" fill="none" />
      <text x="65" y="94" fill="#34d399" font-family="sans-serif" font-size="8" text-anchor="middle">Preserves Edge Gradients</text>
    </g>

    <g transform="translate(20, 195)">
      <text x="0" y="15" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">• Edge-Preserving Denoising</text>
      <text x="0" y="32" fill="#94a3b8" font-family="sans-serif" font-size="10">  Diameter: d = 9</text>
      <text x="0" y="52" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">• Dual Gaussian Kernels</text>
      <text x="0" y="69" fill="#94a3b8" font-family="sans-serif" font-size="10">  σColor = 75, σSpace = 75</text>
      <text x="0" y="89" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">✓ Suppresses scanner grain</text>
    </g>
  </g>

  <!-- STAGE 3: CLAHE in LAB -->
  <g transform="translate(550, 140)" filter="url(#shadow)">
    <rect width="220" height="300" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1.2" />
    <rect width="220" height="4" rx="2" fill="url(#purple)" />

    <rect x="20" y="25" width="28" height="28" rx="6" fill="#c084fc" fill-opacity="0.15" />
    <text x="34" y="44" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">3</text>
    <text x="58" y="44" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">CLAHE (LAB Space)</text>

    <!-- Contrast Simulation -->
    <g transform="translate(45, 75)">
      <rect width="130" height="100" rx="8" fill="#020617" stroke="#1e293b" />
      <rect x="20" y="15" width="90" height="70" rx="35" fill="#8b5cf6" fill-opacity="0.4" />
      <circle cx="65" cy="50" r="18" fill="#f43f5e" fill-opacity="0.8" />
      <text x="65" y="94" fill="#c084fc" font-family="sans-serif" font-size="8" text-anchor="middle">Soft-Tissue Separation</text>
    </g>

    <g transform="translate(20, 195)">
      <text x="0" y="15" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600">• LAB Color Transform</text>
      <text x="0" y="32" fill="#94a3b8" font-family="sans-serif" font-size="10">  Equalize L (lightness) channel</text>
      <text x="0" y="52" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600">• Adaptive Clip Limit</text>
      <text x="0" y="69" fill="#94a3b8" font-family="sans-serif" font-size="10">  clipLimit=2.0, tileGrid=(8,8)</text>
      <text x="0" y="89" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">✓ Sharpens tumor borders</text>
    </g>
  </g>

  <!-- STAGE 4: Resize & Standardize -->
  <g transform="translate(800, 140)" filter="url(#shadow)">
    <rect width="250" height="300" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1.2" />
    <rect width="250" height="4" rx="2" fill="url(#amber)" />

    <rect x="20" y="25" width="28" height="28" rx="6" fill="#fbbf24" fill-opacity="0.15" />
    <text x="34" y="44" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">4</text>
    <text x="58" y="44" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Standardization</text>

    <!-- 224x224 Simulation -->
    <g transform="translate(60, 75)">
      <rect width="130" height="100" rx="8" fill="#020617" stroke="#1e293b" />
      <rect x="35" y="20" width="60" height="60" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="65" y="55" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">224 × 224</text>
      <text x="65" y="94" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Tensor Ready (3 Channels)</text>
    </g>

    <g transform="translate(20, 195)">
      <text x="0" y="15" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600">• Inter-Area Interpolation</text>
      <text x="0" y="32" fill="#94a3b8" font-family="sans-serif" font-size="10">  Target shape: 224×224 pixels</text>
      <text x="0" y="52" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600">• ImageNet Normalization</text>
      <text x="0" y="69" fill="#94a3b8" font-family="sans-serif" font-size="10">  μ=[0.485, 0.456], σ=[0.229, 0.224]</text>
      <text x="0" y="89" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">✓ PyTorch DataLoader Ready</text>
    </g>
  </g>
</svg>
