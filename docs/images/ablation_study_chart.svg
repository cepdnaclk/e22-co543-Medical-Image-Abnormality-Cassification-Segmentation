<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAbl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardAbl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="barRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="barAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1100" height="460" fill="url(#bgAbl)" />

  <!-- Header -->
  <g transform="translate(50, 35)">
    <text x="0" y="24" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">EXPERIMENTAL VALIDATION</text>
    <text x="0" y="52" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="800">3-Stage Ablation Study: Impact of Preprocessing &amp; Augmentations</text>
    <text x="0" y="74" fill="#94a3b8" font-family="sans-serif" font-size="13">Isolating performance contributions across raw baseline, geometry augmentations, and soft-tissue enhancement</text>
  </g>

  <!-- Main Chart Container -->
  <g transform="translate(50, 115)" filter="url(#shadow)">
    <rect width="1000" height="300" rx="14" fill="url(#cardAbl)" stroke="#334155" stroke-width="1.2" />

    <!-- Grid lines -->
    <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.5">
      <line x1="80" y1="210" x2="940" y2="210" />
      <line x1="80" y1="150" x2="940" y2="150" />
      <line x1="80" y1="90" x2="940" y2="90" />
      <line x1="80" y1="30" x2="940" y2="30" />
    </g>

    <text x="65" y="214" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">70%</text>
    <text x="65" y="154" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">80%</text>
    <text x="65" y="94" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">90%</text>
    <text x="65" y="34" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">100%</text>

    <!-- BAR 1: Pure Raw Baseline -->
    <g transform="translate(140, 0)">
      <rect x="0" y="190" width="160" height="40" rx="6" fill="url(#barRed)" />
      <text x="80" y="175" fill="#fca5a5" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">73.19%</text>
      <text x="80" y="250" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. Pure Raw Baseline</text>
      <text x="80" y="270" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">No Preprocessing, No Aug</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(350, 140)">
      <path d="M 0 0 L 50 0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
      <text x="25" y="-12" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">+20.12%</text>
    </g>

    <!-- BAR 2: Raw + Augmentations -->
    <g transform="translate(430, 0)">
      <rect x="0" y="70" width="160" height="160" rx="6" fill="url(#barAmber)" />
      <text x="80" y="55" fill="#fde68a" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">93.31%</text>
      <text x="80" y="250" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. Raw + Augmentation</text>
      <text x="80" y="270" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Albumentations, No Preproc</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <g transform="translate(640, 60)">
      <path d="M 0 0 L 50 0" stroke="#10b981" stroke-width="2" />
      <text x="25" y="-12" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">+2.38%</text>
    </g>

    <!-- BAR 3: Full Medical Pipeline -->
    <g transform="translate(720, 0)">
      <rect x="0" y="26" width="160" height="204" rx="6" fill="url(#barGreen)" />
      <text x="80" y="16" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">95.69%</text>
      <text x="80" y="250" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">3. Full Medical Pipeline</text>
      <text x="80" y="270" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Crop + Bilateral + CLAHE + Aug</text>
    </g>

    <line x1="80" y1="230" x2="940" y2="230" stroke="#475569" stroke-width="1.5" />
  </g>
</svg>
