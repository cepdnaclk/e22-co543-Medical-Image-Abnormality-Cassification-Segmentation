<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="45%" stop-color="#0b1329" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Heatmap Radar Gradient -->
    <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.55" />
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Coordinate Grid Background -->
  <rect width="1200" height="360" rx="18" fill="url(#cyberGrid)" />

  <!-- Ambient Light Halos -->
  <circle cx="1060" cy="90" r="180" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="980" cy="250" r="140" fill="#ec4899" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="80" cy="300" r="160" fill="#8b5cf6" fill-opacity="0.09" filter="url(#glow)" />
  <circle cx="450" cy="50" r="120" fill="#10b981" fill-opacity="0.06" filter="url(#glow)" />

  <!-- RIGHT SIDE: Medical AI / Neuro-Imaging Motif -->
  <g transform="translate(890, 20)">
    <!-- Scanning Rings -->
    <circle cx="140" cy="140" r="125" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="140" cy="140" r="100" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" />
    <circle cx="140" cy="140" r="70" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="8 6" stroke-opacity="0.4" />
    <circle cx="140" cy="140" r="40" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Crosshair Target -->
    <line x1="140" y1="5" x2="140" y2="275" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.25" />
    <line x1="5" y1="140" x2="275" y2="140" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.25" />

    <!-- Simulated Grad-CAM Lesion Heatmap Spot -->
    <ellipse cx="155" cy="125" rx="42" ry="34" fill="url(#heatGlow)" filter="url(#softGlow)"/>

    <!-- Neural Network Nodes & Connectors -->
    <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5">
      <line x1="85" y1="90" x2="120" y2="70" />
      <line x1="120" y1="70" x2="165" y2="95" />
      <line x1="165" y1="95" x2="195" y2="135" />
      <line x1="195" y1="135" x2="160" y2="175" />
      <line x1="160" y1="175" x2="110" y2="165" />
      <line x1="110" y1="165" x2="85" y2="90" />
      <line x1="120" y1="70" x2="160" y2="175" stroke-dasharray="3 3" />
    </g>

    <circle cx="85" cy="90" r="4" fill="#38bdf8" />
    <circle cx="120" cy="70" r="5" fill="#34d399" />
    <circle cx="165" cy="95" r="5" fill="#f43f5e" />
    <circle cx="195" cy="135" r="4.5" fill="#a855f7" />
    <circle cx="160" cy="175" r="4" fill="#38bdf8" />
    <circle cx="110" cy="165" r="4" fill="#f59e0b" />

    <!-- Bounding Box / CAM Localization HUD -->
    <rect x="125" y="98" width="60" height="54" rx="4" fill="none" stroke="#f43f5e" stroke-width="1.6" stroke-dasharray="6 3"/>
    <rect x="125" y="86" width="60" height="12" rx="2" fill="#f43f5e" fill-opacity="0.85"/>
    <text x="155" y="94.5" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle" dominant-baseline="middle">LESION ROI</text>

    <!-- Scan Info HUD Overlay -->
    <rect x="25" y="248" width="230" height="24" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <circle cx="37" cy="260" r="3.5" fill="#10b981" />
    <text x="48" y="260.5" fill="#94a3b8" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="700" dominant-baseline="middle">MRI T1-CE • GRAD-CAM LOCALIZED</text>
  </g>

  <!-- LEFT & CENTER: Institutional Pill Badge -->
  <g transform="translate(48, 28)">
    <rect width="430" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="16" cy="13" r="4" fill="#38bdf8" />
    <text x="225" y="13.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" dominant-baseline="middle" text-anchor="middle">UNIVERSITY OF PERADENIYA • DEPT. OF COMPUTER ENGINEERING</text>
  </g>

  <!-- Project Title & Subtitle -->
  <g transform="translate(48, 68)">
    <text x="0" y="32" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" letter-spacing="-0.8" dominant-baseline="middle">Medical Image Abnormality Classification &amp; Localization</text>
    <text x="0" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" dominant-baseline="middle">Dual-Backbone Deep Learning (ResNet-18 &amp; EfficientNet-B0) • 4-Stage Preprocessing • Grad-CAM Explainability</text>
  </g>

  <!-- Classification Chips -->
  <g transform="translate(48, 154)">
    <rect x="0" y="0" width="85" height="22" rx="11" fill="#1e293b" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="42.5" y="11.5" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">GLIOMA</text>

    <rect x="95" y="0" width="115" height="22" rx="11" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="152.5" y="11.5" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">MENINGIOMA</text>

    <rect x="220" y="0" width="95" height="22" rx="11" fill="#1e293b" stroke="#a855f7" stroke-width="0.8"/>
    <text x="267.5" y="11.5" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">PITUITARY</text>

    <rect x="325" y="0" width="95" height="22" rx="11" fill="#1e293b" stroke="#10b981" stroke-width="0.8"/>
    <text x="372.5" y="11.5" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">NO TUMOR</text>

    <rect x="430" y="0" width="150" height="22" rx="11" fill="#0b1329" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 2"/>
    <text x="505" y="11.5" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle" dominant-baseline="middle">7,023 MRI SCANS (Nickparvar)</text>
  </g>

  <!-- 5 Glassmorphic Key Metric Cards (Width 208px, Gap 16px, Total 1104px) -->
  <g transform="translate(48, 194)">
    <!-- Metric 1: Test Accuracy -->
    <g transform="translate(0, 0)">
      <rect width="208" height="68" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="12" y="12" width="6" height="6" rx="3" fill="#38bdf8"/>
      <text x="26" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" dominant-baseline="middle">TEST ACCURACY</text>
      <text x="104" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" dominant-baseline="middle">95.69%</text>
    </g>

    <!-- Metric 2: Preprocessing Gain -->
    <g transform="translate(224, 0)">
      <rect width="208" height="68" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.2"/>
      <rect x="12" y="12" width="6" height="6" rx="3" fill="#10b981"/>
      <text x="26" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" dominant-baseline="middle">PREPROCESSING GAIN</text>
      <text x="104" y="44" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle" dominant-baseline="middle">+22.50% (73% → 96%)</text>
    </g>

    <!-- Metric 3: EfficientNet Efficiency -->
    <g transform="translate(448, 0)">
      <rect width="208" height="68" rx="12" fill="url(#cardBg)" stroke="#c084fc" stroke-width="1.2"/>
      <rect x="12" y="12" width="6" height="6" rx="3" fill="#c084fc"/>
      <text x="26" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" dominant-baseline="middle">COMPUTATIONAL EFFICIENCY</text>
      <text x="104" y="44" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle" dominant-baseline="middle">-64% Params • -79% FLOPs</text>
    </g>

    <!-- Metric 4: Explainability -->
    <g transform="translate(672, 0)">
      <rect width="208" height="68" rx="12" fill="url(#cardBg)" stroke="#f43f5e" stroke-width="1.2"/>
      <rect x="12" y="12" width="6" height="6" rx="3" fill="#f43f5e"/>
      <text x="26" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" dominant-baseline="middle">EXPLAINABLE AI</text>
      <text x="104" y="44" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle">Grad-CAM Localization</text>
    </g>

    <!-- Metric 5: Acceleration Platform -->
    <g transform="translate(896, 0)">
      <rect width="208" height="68" rx="12" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="12" y="12" width="6" height="6" rx="3" fill="#f59e0b"/>
      <text x="26" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" dominant-baseline="middle">COMPUTE PLATFORM</text>
      <text x="104" y="44" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle" dominant-baseline="middle">RTX 6000 Ada • CUDA 13</text>
    </g>
  </g>

  <!-- Bottom Details & Academic Footer -->
  <g transform="translate(48, 290)">
    <line x1="0" y1="0" x2="1104" y2="0" stroke="#334155" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" dominant-baseline="middle">CO5430 Computer Vision Project • Group 14 (P19) • Faculty of Engineering, University of Peradeniya</text>
    <text x="1104" y="24" fill="#475569" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="700" text-anchor="end" dominant-baseline="middle">PyTorch 2.1+ • OpenCV 4.10+ • Albumentations 2.0+</text>
  </g>
</svg>
